<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/styleGeral.css">
    <style>
        body {
            height: 100dvh;
            background: linear-gradient(135deg, var(--primary) 0%, var(--tertiary) 55%, var(--secundary) 100%);
            padding: 1.5rem 0;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, .12);
            padding: 2rem;
        }

        /* Tabs */
        .nav-pills .nav-link {
            color: #555;
            border-radius: .65rem;
            font-weight: 500;
        }

        .nav-pills .nav-link.active {
            background-color: var(--primary2);
            color: #fff;
        }

        /* Inputs */
        .form-control:focus {
            border-color: var(--tertiary2);
            box-shadow: 0 0 0 .25rem rgba(99, 208, 217, .25);
        }

        /* Buttons */
        .btn-login {
            background-color: var(--primary2);
            border-color: var(--primary2);
            color: #fff;
        }

        .btn-login:hover {
            background-color: #c875ec;
            border-color: #c875ec;
            color: #fff;
        }

        .btn-signup {
            background-color: var(--secundary2);
            border-color: var(--secundary2);
            color: #5c4a00;
        }

        .btn-signup:hover {
            background-color: #e9cd6e;
            border-color: #e9cd6e;
            color: #5c4a00;
        }

        .link-forgot {
            color: var(--tertiary2);
            text-decoration: none;
            font-size: .9rem;
        }

        .link-forgot:hover {
            text-decoration: underline;
            color: #4cb6c0;
        }

        .toggle-password {
            border-color: #ced4da;
            color: #6c757d;
            background-color: #fff;
        }

        .input-group:focus-within .form-control,
        .input-group:focus-within .toggle-password {
            border-color: var(--tertiary2);
        }

        .input-group:focus-within .form-control {
            box-shadow: 0 0 0 .25rem rgba(99, 208, 217, .25);
        }

        .toggle-password:hover {
            background-color: #f8f9fa;
            color: #495057;
        }

        .toggle-password:focus {
            box-shadow: 0 0 0 .25rem rgba(99, 208, 217, .25);
            z-index: 3;
        }
    </style>
</head>

<body>
    <header id="main-header" class="fixed-top w-100 z-3"
        style="transition: background-color 0.4s ease, backdrop-filter 0.4s ease;">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid ms-0 d-flex justify-content-center align-items-center">

                <a href="/pages/produtos.html" class="navbar-brand d-inline-block p-0 m-2">
                    <img src="../assets/logo.png" alt="logo" class="img-fluid" style="max-width: 250px;">
                </a>

                <div class="d-none d-lg-block collapse navbar-collapse text-center mt-3 mt-lg-0" id="MenuNav">
                    <ul class="navbar-nav ms-auto d-flex flex-column flex-lg-row align-items-center gap-3 gap-lg-4">
                        <li class="nav-item">
                            <a class="nav-link p-0" href="index.html">SOBRE</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link p-0" href="/pages/produtos.html">PRODUTOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link p-0" href="#">APRENDER</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>
    <main class="container d-flex align-items-center justify-content-center" style="height: 80dvh;">
        <div class="auth-card position-fixed top-50 start-50 translate-middle">
            <ul class="nav nav-pills nav-fill mb-4" id="authTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login"
                        type="button" role="tab" aria-controls="login" aria-selected="true">Entrar</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup"
                        type="button" role="tab" aria-controls="signup" aria-selected="false">Criar conta</button>
                </li>
            </ul>

            <div class="tab-content" id="authTabContent">

                <!-- LOGIN -->
                <section class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                    <div class="mb-3 text-center">
                        <h1 class="fs-4 fw-bold mb-1">Bem vinda de volta!</h1>
                        <p class="text-secondary mb-0">Entre com seu e-mail e senha</p>
                    </div>
                    <form method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="text" class="form-control" name="email" id="email" placeholder="seu@email.com">
                        </div>
                        <div class="mb-2">
                            <label for="password" class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password" class="form-control" name="password" id="password"
                                    placeholder="Sua senha">
                                <button type="button" class="btn btn-outline-secondary toggle-password"
                                    aria-label="Mostrar senha">
                                    <i class="icon-eye bi bi-eye-fill"></i>
                                    <i class="icon-eye-slash bi bi-eye-slash-fill d-none"></i>
                                </button>
                            </div>
                        </div>
                        <div class="text-end mb-3">
                            <a href="saveLogin.html" class="link-forgot">Esqueci senha/email</a>
                        </div>
                        <button type="submit" class="btn btn-login w-100">Entrar</button>
                    </form>
                </section>

                <!-- SIGN UP -->
                <section class="tab-pane fade" id="signup" role="tabpanel" aria-labelledby="signup-tab">
                    <div class="mb-3 text-center">
                        <h1 class="fs-4 fw-bold mb-1">Crie sua conta</h1>
                        <p class="text-secondary mb-0">Preencha os dados abaixo</p>
                    </div>
                    <form method="post">
                        <div class="mb-3">
                            <label for="nameSignup" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" name="name" id="nameSignup" placeholder="Seu nome">
                        </div>
                        <div class="mb-3">
                            <label for="emailSignup" class="form-label">E-mail</label>
                            <input type="text" class="form-control" name="email" id="emailSignup"
                                placeholder="seu@email.com">
                        </div>
                        <div class="mb-3">
                            <label for="passwordSignup" class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password" class="form-control" name="password" id="passwordSignup"
                                    placeholder="Sua senha">
                                <button type="button" class="btn btn-outline-secondary toggle-password"
                                    aria-label="Mostrar senha">
                                    <i class="icon-eye bi bi-eye-fill"></i>
                                    <i class="icon-eye-slash bi bi-eye-slash-fill d-none"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="passwordConfirm" class="form-label">Confirmar senha</label>
                            <div class="input-group">
                                <input type="password" class="form-control" name="passwordConfirm" id="passwordConfirm"
                                    placeholder="Sua senha novamente">
                                <button type="button" class="btn btn-outline-secondary toggle-password"
                                    aria-label="Mostrar senha">
                                    <i class="icon-eye bi bi-eye-fill"></i>
                                    <i class="icon-eye-slash bi bi-eye-slash-fill d-none"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-signup w-100">Criar conta</button>
                    </form>
                </section>

            </div>
        </div>
    </main>
    <footer class="border-top border-1 border-purple2 bg-purple w-100 p-3 position-fixed bottom-0 start-0">
        <div class="text-center">
            <h4>Prisma <span class="text-purple2">MakeUp</span></h4>
            <ul class="list-unstyled d-flex justify-content-center gap-4">
                <li><a class="text-decoration-none text-secondary" href="">Sobre</a></li>
                <li><a class="text-decoration-none text-secondary" href="">Produtos</a></li>
                <li><a class="text-decoration-none text-secondary" href="">Aprender</a></li>
            </ul>
            <p class="text-secondary m-0">© 2026 Prisma MakeUp. Todos os direitos reservados.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const input = btn.closest('.input-group').querySelector('input');
                const eyeIcon = btn.querySelector('.icon-eye');
                const eyeSlashIcon = btn.querySelector('.icon-eye-slash');
                const isHidden = input.type === 'password';

                input.type = isHidden ? 'text' : 'password';
                eyeIcon.classList.toggle('d-none', isHidden);
                eyeSlashIcon.classList.toggle('d-none', !isHidden);
                btn.setAttribute('aria-label', isHidden ? 'Esconder senha' : 'Mostrar senha');
            });
        });
    </script>
</body>

</html>
