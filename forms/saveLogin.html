<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/styleGeral.css">
    <style>
        :root {
            --primary: #F4D6F8;
            --secundary: #F8F3D6;
            --tertiary: #D5F8F2;
            --primary2: #DE97F2;
            --secundary2: #F2DE97;
            --tertiary2: #63d0d9;
        }

        body {
            height: 100dvh;
            background: linear-gradient(135deg, var(--primary) 0%, var(--tertiary) 55%, var(--secundary) 100%);
            padding-top: 150px; /* Espaço para o header */
            padding-bottom: 150px; /* Espaço para o footer */
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, .12);
            padding: 2rem;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: var(--primary2);
        }

        .form-control:focus {
            border-color: var(--tertiary2);
            box-shadow: 0 0 0 .25rem rgba(99, 208, 217, .25);
        }

        .btn-login {
            background-color: var(--primary2);
            border-color: var(--primary2);
            color: #fff;
        }

        .btn-login:hover {
            background-color: #c875ec;
            border-color: #c875ec;
            color: #fff;
        }

        .link-forgot {
            color: var(--tertiary2);
            text-decoration: none;
            font-size: .9rem;
        }

        .link-forgot:hover {
            text-decoration: underline;
            color: #4cb6c0;
        }
    </style>
</head>

<body>
    <header id="main-header" class="fixed-top w-100 z-3"
        style="transition: background-color 0.4s ease, backdrop-filter 0.4s ease;">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid ms-0 d-flex justify-content-center align-items-center">

                <a href="/pages/produtos.html" class="navbar-brand d-inline-block p-0 m-2">
                    <img src="../assets/logo.png" alt="logo" class="img-fluid" style="max-width: 250px;">
                </a>

                <div class="d-none d-lg-block collapse navbar-collapse text-center mt-3 mt-lg-0" id="MenuNav">
                    <ul class="navbar-nav ms-auto d-flex flex-column flex-lg-row align-items-center gap-3 gap-lg-4">
                        <li class="nav-item">
                            <a class="nav-link p-0" href="../index.html">SOBRE</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link p-0" href="/pages/produtos.html">PRODUTOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link p-0" href="#">APRENDER</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>
    <main class="container d-flex align-items-center justify-content-center">
        <div class="auth-card position-fixed top-50 start-50 translate-middle">
            <div class="icon-circle">
                <i class="bi bi-lock-fill fs-2"></i>
            </div>

            <div class="mb-4 text-center">
                <h1 class="fs-4 fw-bold mb-1">Esqueci minha senha</h1>
                <p class="text-secondary mb-0">Informe seu e-mail e enviaremos um link para você criar uma nova
                    senha</p>
            </div>

            <form method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="text" class="form-control" name="email" id="email" placeholder="seu@email.com">
                </div>
                <button type="submit" class="btn btn-login w-100 mb-3">Enviar link de recuperação</button>
                <div class="text-center">
                    <a href="login.html" class="link-forgot">Voltar para o login</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="border-top border-1 border-purple2 bg-purple w-100 p-3 position-fixed bottom-0 start-0">
        <div class="text-center">
            <h4>Prisma <span class="text-purple2">MakeUp</span></h4>
            <ul class="list-unstyled d-flex justify-content-center gap-4">
                <li><a class="text-decoration-none text-secondary" href="../index.html">Sobre</a></li>
                <li><a class="text-decoration-none text-secondary" href="/pages/produtos.html">Produtos</a></li>
                <li><a class="text-decoration-none text-secondary" href="#">Aprender</a></li>
            </ul>
            <p class="text-secondary m-0">© 2026 Prisma MakeUp. Todos os direitos reservados.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
